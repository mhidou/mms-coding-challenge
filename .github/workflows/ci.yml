name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node (version from .nvmrc, npm cache)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a mongod binary (~70 MB) on first
      # run; caching it keeps e2e runs fast. No MongoDB service container
      # is needed — tests run against the in-memory server.
      - name: Cache MongoDB binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run test:e2e
